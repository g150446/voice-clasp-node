# MCUboot board config for XIAO nRF52840 Sense

# Standard nRF52840 internal flash driver
CONFIG_FLASH=y

# Support large application images
CONFIG_BOOT_MAX_IMG_SECTORS=256

# Disable USB in MCUboot (not needed, saves space)
CONFIG_USB_DEVICE_STACK=n

# Feed the app's watchdog during the swap.
# The nRF52 WDT keeps running across a soft reset -- only a POR stops it -- so
# after the SMP reset it is still armed while MCUboot copies 256 KB, which takes
# far longer than WDT_TIMEOUT_MS. With this off the dog fired mid-swap every
# single OTA: the swap is resumable so the update still completed, but each one
# cost an extra reset and resume, and the app booted reporting
# SOFTWARE|WATCHDOG. Found via the 0.0.103 boot report (EVT_BOOT_REPORT 0xD3).
CONFIG_BOOT_WATCHDOG_FEED=y

# Stack protection not needed in MCUboot
CONFIG_HW_STACK_PROTECTION=n
