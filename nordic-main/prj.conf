# Zephyr Kernel Configuration for XIAO nRF52840 Sense - nordic-main (Handy BLE)

CONFIG_MAIN_STACK_SIZE=4096

# Heap (BLE stack + MCUmgr + audio needs memory)
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Logging and console (USB CDC ACM on XIAO nRF52840)
CONFIG_LOG=y
# Deferred logging (the Zephyr default, and what this app has always actually
# run: the old `CONFIG_LOG_MODE_DEFERRED=n` was a no-op because LOG_MODE is a
# Kconfig choice). Do NOT switch to CONFIG_LOG_MODE_IMMEDIATE=y with the CDC ACM
# console: cdc_acm_poll_out() calls LOG_WRN_ONCE("Ring buffer full, discard
# data") when the TX ring is full, which in immediate mode re-enters the log
# output path from inside itself. The ring IS full at boot -- the USB host has
# not opened the port yet -- so the device hangs before configure_watchdog()
# and stops advertising. 0.0.101 was lost to exactly this.
# Flush the deferred log 10x more often instead, so less is lost before a hang.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# USB CDC ACM console
CONFIG_USB_CDC_ACM=y

# Peripherals
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# Audio (PDM microphone)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Bluetooth Low Energy
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_SMP=n
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_NAME="ClaspNode"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=20
CONFIG_BT_GATT_CLIENT=y

# BLE MTU (OTA transfer efficiency + audio throughput)
CONFIG_BT_L2CAP_TX_MTU=244
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_ATT_TX_COUNT=12
CONFIG_BT_CONN_TX_MAX=8

# GAP PPCP (Android may apply these after discovery).
# Zephyr default timeout=42 (420 ms) is too short and drops the link.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800

# MCUmgr (SMP server for BLE OTA)
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_VERBOSE_ERR=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.117+0"
CONFIG_MCUMGR_GRP_OS=y

# DFU runs at the idle interval since 0.0.100 (fast is recording-only), which
# costs 3-4x on OTA. Let the SMP transport request 7.5-15 ms while a transfer
# is active. The default TIMEOUT here is 42 (420 ms) -- the exact value that
# drops Android -- so it must be overridden to match the 8 s used everywhere.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MIN_INT=6
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MAX_INT=12
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_LATENCY=0
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_TIMEOUT=800

# MCUmgr dependencies
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y

# Settings persistence (image confirm state survives reboot)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y

# Watchdog timer
CONFIG_WATCHDOG=y

# SYSTEMOFF when left alone (3 min from cold boot, 30 min after losing a
# peer -- see ADV_*_SLEEP_MS in main.c). Single or double tap on IMU INT1 wakes.
CONFIG_POWEROFF=y

# Hardware info (read reset cause)
CONFIG_HWINFO=y

# sys_reboot() for the "reboot into the UF2 bootloader" command (RX 0x60 /
# serial 'b'). Already selected transitively, but MCUboot is only reachable by a
# UF2 write, so this path must not silently disappear on a Kconfig reshuffle.
CONFIG_REBOOT=y

# I2C + IMU（LSM6DS3TR-C）
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y

# Battery monitoring
CONFIG_ADC=y
CONFIG_BT_BAS=y
CONFIG_NRFX_POWER=y

# Cortex-M4F: shared FP state for main/audio/Bluetooth thread contexts.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
