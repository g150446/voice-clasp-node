# XIAO nRF54L15 Sense shared IMU/PDM rail power test

CONFIG_MAIN_STACK_SIZE=4096

# Quiet UART console: state markers are emitted with printk only.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_DYNAMIC=y

CONFIG_REGULATOR=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# No radio activity during current measurement.
CONFIG_BT=n

# Required by the board and available for sensor/device power management.
CONFIG_PM_DEVICE=y
