# Low-noise measurement build for pdm_power_test.
#
# Merged on top of prj.conf via:
#   ./build_and_flash.sh --quiet
#
# The UART console is the loudest thing on the board that is not the device
# under test. Removing it makes the UT70 baseline quieter, but also removes the
# only state indicator: the onboard LED deliberately remains off. Use this
# variant only when the measurement can be aligned to the 20-second boundaries
# from power-on or reset.

CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_CBPRINTF_FP_SUPPORT=n

# The boot banner selects PRINTK and EARLY_CONSOLE, so CONFIG_PRINTK=n above is
# silently reverted unless the banner goes too.
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=n

# Optional: also powers down the UART20 peripheral itself. Left off by default
# so the build stays close to the normal one; enable if the baseline is still
# too noisy to read the 0.7 mA step.
# CONFIG_SERIAL=n
